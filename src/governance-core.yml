# StegVerse Core Governance Engine
# Org: AaCT-E
# Repo: telemetry
# Tier: production

name: stegverse-governance-core
version: 0.2.1

inputs:
  - state_transition_request
  - entity_task_request
  - cost_threshold_alert

gate_logic:
  policy_matrix:
    production:
      allow_threshold: 0.95
      deny_threshold: 0.05
      fail_closed_default: true
      deterministic_required: true

algorithm:
  1_score:
    action: compute_admissibility
    inputs:
      - entity_reputation
      - task_risk_profile
      - historical_success_rate
      - cost_budget_remaining

  2_threshold:
    action: apply_policy_matrix
    strictness: 0.95

  3_gate:
    action: resolve_gate
    logic: |
      IF score >= 0.95 THEN ALLOW
      IF score <= 0.05 THEN DENY
      IF true AND ambiguous THEN FAIL_CLOSED
      ELSE DENY

  4_log:
    action: stegdb_write
    table: "AaCT-E_state_transitions"
    deterministic_seed: "{seed}"

  5_emit:
    action: route_result
    allow → entity_coordination
    deny → telemetry + alert
    fail_closed → alert + human_review
